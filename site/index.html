<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>ورق | مساحتي</title>
  <style>
    *{box-sizing:border-box}body{margin:0;background:#fcfaf4;color:#24251f;font:16px/1.6 Tahoma,Arial,sans-serif}button,input,select,textarea{font:inherit;color:inherit}button{cursor:pointer;border:1px solid #ccc9bd;background:#fffdf7;border-radius:9px;padding:8px 15px}button:hover{filter:brightness(.96)}button:focus-visible,input:focus-visible,textarea:focus-visible,select:focus-visible{outline:3px solid #179e85}header{border-bottom:1px solid #d9d6cb;background:#fffdf8}header>div,main{max-width:1190px;margin:auto;padding-inline:5%}header>div{height:76px;display:flex;align-items:center;gap:14px}.brand{font-size:34px;font-weight:900}.logo{background:#b4edcf;border:2px solid;border-radius:11px;width:39px;height:39px;display:grid;place-items:center;font-size:27px}.date{margin-inline-start:auto;color:#595a50;font-size:14px}main{padding-bottom:55px}.hero{margin:29px 0 26px;background:#c6eed9;border:1px solid #93bb9e;border-radius:20px;padding:34px 6%;position:relative;overflow:hidden}.hero:after{content:"✦";position:absolute;left:9%;top:18px;font-size:105px;color:#76a98a;transform:rotate(-12deg)}.hero h1{font-size:clamp(36px,5vw,62px);line-height:1.25;margin:0}.hero p{margin:6px 0 18px}.primary{background:#25271f;color:#fff;border-color:#25271f;font-weight:bold}.row{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}h2{font-size:23px;margin:12px 0}.section{margin-top:27px}.shelves{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}.shelf{text-align:right;padding:17px;font-weight:bold}.shelf:nth-child(1){background:#f7e7a9}.shelf:nth-child(2){background:#dfd4f5}.shelf:nth-child(3){background:#cde4f2}.shelf small{display:block;font-weight:normal;color:#555}.selected{outline:2px solid #46483d;outline-offset:2px}.projects{display:flex;gap:9px;flex-wrap:wrap}.projects button{background:#efede4}.projects b{margin-inline-start:8px}.tools{display:flex;gap:8px;flex-wrap:wrap}.search,input,textarea,select{border:1px solid #c9c8bb;border-radius:8px;background:#fff;padding:8px 12px}.notes{display:grid;grid-template-columns:repeat(auto-fill,minmax(235px,1fr));gap:12px;margin-top:14px}.note,.empty{background:#fffefa;border:1px solid #d4d1c4;border-radius:12px;padding:19px}.note{text-align:start}.note strong{display:block;font-size:19px}.note p{white-space:pre-line;color:#595950}.muted,.note small{color:#626358;font-size:14px}.empty{grid-column:1/-1;text-align:center;border-style:dashed}.todo-card{background:#f7e7a9;border:1px solid #c8b86f;border-radius:16px;padding:18px}.todo-form{display:flex;gap:8px}.todo-form input{flex:1;min-width:0}.todo-list{display:grid;gap:8px;margin-top:14px}.todo-item{display:flex;align-items:center;gap:10px;background:#fffdf7;border:1px solid #d8cfaa;border-radius:10px;padding:10px 12px}.todo-item input{width:19px;height:19px;accent-color:#179e85}.todo-item span{flex:1}.todo-item.done span{text-decoration:line-through;color:#77766d}.todo-empty{text-align:center;padding:16px;color:#626358;border:1px dashed #b9aa70;border-radius:10px}.todo-count{font-size:14px;color:#626358}.ghost{background:none;border:none;padding:5px}.danger{color:#a23131}dialog{border:1px solid #999988;border-radius:18px;width:min(520px,94vw);background:#fcfaf4;padding:22px}dialog::backdrop{background:#21272066}form{display:grid;gap:10px}label{display:grid;gap:3px}textarea{resize:vertical;min-height:125px}.hide{display:none!important}footer{margin-top:29px;border-top:1px solid #d4d1c4;padding-top:15px}@media(max-width:650px){header>div{height:62px}.hero{padding:24px 5%}.hero p{max-width:72%}.hero:after{font-size:65px}.shelves{gap:7px}.shelf{padding:10px;font-size:14px}.todo-form{flex-direction:column}.tools{width:100%}.search{flex:1;min-width:120px}}
    .logo{font-size:0;position:relative}.logo:before{content:"";width:18px;height:23px;background:#fff8de;border:2px solid #292b24;border-radius:3px;box-shadow:4px 0 0 #ffdc78;transform:rotate(-7deg)}.hero{min-height:228px;display:flex;align-items:center;isolation:isolate}.hero:after{content:"";z-index:-1;width:134px;height:164px;left:12%;top:30px;border:2.5px solid #34352b;border-radius:9px;background:linear-gradient(90deg,#e7c35f 0 16px,#34352b 16px 18px,#ffdc78 18px);transform:rotate(-14deg);box-shadow:5px 5px #444638}.hero:before{content:"";position:absolute;z-index:-1;width:82px;height:73px;left:29%;bottom:26px;transform:rotate(10deg);background:repeating-linear-gradient(#dac8ff 0 16px,#8b78a7 17px,#dac8ff 18px);border:2px solid #37332f;box-shadow:3px 3px #37332f}.todo-empty{font-size:0}.todo-empty:after{content:"قائمتك جاهزة لأول مهمة";font-size:16px}@media(max-width:650px){.hero:after{width:77px;height:102px;left:8%;top:45px}.hero:before{width:43px;height:47px;left:27%;bottom:30px}}
  </style>
</head>
<body>
<header><div><span class="logo" aria-hidden="true"></span><span class="brand">ورق</span><span>/ مساحتي</span><span class="date" id="date"></span></div></header>
<main>
  <section class="hero"><h1>دفتر أفكاري</h1><p>لليوميات، والأفكار العابرة، وتفاصيل المشاريع.</p><button class="primary" id="newNote">ملاحظة جديدة</button></section>
  <h2>دفاتري</h2><div class="shelves" id="shelves"></div>
  <section class="section"><div class="row"><h2>مشاريعي التقنية</h2><button id="newProject">مشروع جديد</button></div><div class="projects" id="projects"></div></section>
  <section class="section todo-card" aria-labelledby="todoTitle"><div class="row"><div><h2 id="todoTitle">قائمة المهام</h2><span class="todo-count" id="todoCount"></span></div><button class="ghost danger" id="clearDone">مسح المكتمل</button></div><form class="todo-form" id="todoForm"><input id="todoInput" maxlength="140" required placeholder="أضيفي مهمة جديدة…" aria-label="مهمة جديدة"><button class="primary">إضافة</button></form><div class="todo-list" id="todoList"></div></section>
  <section class="section"><div class="row"><h2 id="heading">كل الملاحظات</h2><div class="tools"><input class="search" id="search" type="search" placeholder="بحث في ملاحظاتي…" aria-label="بحث"><button id="all">عرض الكل</button></div></div><div class="notes" id="notes"></div></section>
  <footer class="row"><span class="muted">تُحفظ الملاحظات في قاعدة ورق، والمهام على هذا الجهاز.</span></footer>
</main>
<dialog id="editor"><form id="noteForm"><div class="row"><h2 id="editorTitle"></h2><button type="button" class="ghost" id="closeEditor">✕</button></div><label>العنوان<input id="titleField" maxlength="180" required></label><label>الملاحظة<textarea id="bodyField"></textarea></label><label>الدفتر<select id="category"></select></label><label id="projectLabel">المشروع<select id="projectField"></select></label><div class="row"><button class="primary">حفظ الملاحظة</button><button type="button" id="remove" class="danger">حذف</button></div></form></dialog>
<dialog id="projectDialog"><form id="projectForm"><h2>مشروع جديد</h2><label>اسم المشروع<input id="projectName" required maxlength="100"></label><div class="row"><button class="primary">إضافة المشروع</button><button type="button" id="cancelProject">إلغاء</button></div></form></dialog>
<script>
"use strict";
const $=id=>document.getElementById(id),cats=["يومياتي","أفكاري","ملاحظاتي التقنية"];
let state={projects:[],notes:[]},filterCat="",filterProject="",editing="",previousDate,busy=false;
const el=(tag,text,cls)=>{const node=document.createElement(tag);node.textContent=text||"";if(cls)node.className=cls;return node};
const fmt=n=>new Intl.NumberFormat("ar-SA").format(n);
async function requestState(data){if(busy)return null;busy=true;try{const options=data?{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(data)}:{};const response=await fetch("/api/notes",{...options,cache:"no-store"});const result=await response.json();if(!response.ok)throw Error(result.error||"تعذر إكمال العملية");state=result;render();return result}catch(error){alert(error.message||"تعذر الاتصال");return null}finally{busy=false}}
function render(){
  $("shelves").replaceChildren(...cats.map(cat=>{const b=el("button","","shelf"+(filterCat===cat?" selected":""));b.append(el("strong",cat),el("small",fmt(state.notes.filter(n=>n.cat===cat).length)+" ملاحظات"));b.onclick=()=>{filterCat=filterCat===cat?"":cat;filterProject="";render()};return b}));
  $("projects").replaceChildren(...state.projects.map(p=>{const b=el("button",p,filterProject===p?"selected":"");b.append(el("b",fmt(state.notes.filter(n=>n.project===p).length)));b.onclick=()=>{filterProject=filterProject===p?"":p;filterCat="";render()};return b}));
  $("heading").textContent=filterProject||filterCat||"كل الملاحظات";const q=$("search").value.trim().toLowerCase();const list=state.notes.filter(n=>(!filterCat||n.cat===filterCat)&&(!filterProject||n.project===filterProject)&&[n.title,n.body,n.cat,n.project].join(" ").toLowerCase().includes(q));
  $("notes").replaceChildren(...list.map(n=>{const b=el("button","","note");b.append(el("small",n.project||n.cat),el("strong",n.title),el("p",n.body.slice(0,145)),el("small",new Date(n.date).toLocaleDateString("ar-SA")));b.onclick=()=>openEditor(n);return b}));if(!list.length)$("notes").append(el("div",q?"لا توجد نتائج مطابقة":"صفحة جديدة تنتظر أفكارك","empty"));
}
function openEditor(n){editing=n?.id||"";previousDate=n?.date;$("editorTitle").textContent=n?"تحرير الملاحظة":"ملاحظة جديدة";$("titleField").value=n?.title||"";$("bodyField").value=n?.body||"";$("category").replaceChildren(...cats.map(c=>new Option(c,c)));$("category").value=n?.cat||filterCat||(filterProject?cats[2]:cats[0]);$("projectField").replaceChildren(new Option("دون مشروع",""),...state.projects.map(p=>new Option(p,p)));$("projectField").value=n?.project||filterProject;$("remove").hidden=!editing;syncProject();$("editor").showModal()}
function syncProject(){const show=$("category").value===cats[2];$("projectLabel").classList.toggle("hide",!show);if(!show)$("projectField").value=""}
$("newNote").onclick=()=>openEditor();$("closeEditor").onclick=()=>$("editor").close();$("category").onchange=syncProject;$("search").oninput=render;$("all").onclick=()=>{filterCat=filterProject=$("search").value="";render()};
$("newProject").onclick=()=>{$("projectName").value="";$("projectDialog").showModal()};$("cancelProject").onclick=()=>$("projectDialog").close();
$("projectForm").onsubmit=async e=>{e.preventDefault();const name=$("projectName").value.trim();if(name&&await requestState({action:"project",name}))$("projectDialog").close()};
$("noteForm").onsubmit=async e=>{e.preventDefault();const note={id:editing||crypto.randomUUID(),title:$("titleField").value.trim(),body:$("bodyField").value,cat:$("category").value,project:$("projectField").value,date:new Date().toISOString()};if(await requestState({action:"save",note,previousDate}))$("editor").close()};
$("remove").onclick=async()=>{if(confirm("حذف هذه الملاحظة؟")&&await requestState({action:"delete",id:editing,previousDate}))$("editor").close()};
const todoKey="waraq-todos-v1";let todos=[];try{todos=JSON.parse(localStorage.getItem(todoKey))||[]}catch{}
function saveTodos(){localStorage.setItem(todoKey,JSON.stringify(todos));renderTodos()}
function renderTodos(){const open=todos.filter(t=>!t.done).length;$("todoCount").textContent=open?fmt(open)+" متبقية":"لا توجد مهام متبقية";$("todoList").replaceChildren(...todos.map(todo=>{const row=el("div","","todo-item"+(todo.done?" done":"")),check=document.createElement("input");check.type="checkbox";check.checked=todo.done;check.setAttribute("aria-label","إكمال "+todo.text);check.onchange=()=>{todo.done=check.checked;saveTodos()};const remove=el("button","حذف","ghost danger");remove.onclick=()=>{todos=todos.filter(t=>t.id!==todo.id);saveTodos()};row.append(check,el("span",todo.text),remove);return row}));if(!todos.length)$("todoList").append(el("div","قائمتك جاهزة لأول مهمة ✦","todo-empty"))}
$("todoForm").onsubmit=e=>{e.preventDefault();const text=$("todoInput").value.trim();if(!text)return;todos.unshift({id:crypto.randomUUID(),text,done:false});$("todoInput").value="";saveTodos()};$("clearDone").onclick=()=>{todos=todos.filter(t=>!t.done);saveTodos()};
$("date").textContent=new Intl.DateTimeFormat("ar-SA-u-ca-gregory",{weekday:"long",day:"numeric",month:"long"}).format(new Date());render();renderTodos();requestState();
</script>
</body></html>
