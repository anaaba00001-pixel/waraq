<!doctype html><html lang="ar" dir="rtl"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ورق | مساحتي</title><style>
*{box-sizing:border-box}body{margin:0;background:#fcfaf4;color:#24251f;font:16px/1.6 Tahoma,Arial,sans-serif}button,input,select,textarea{font:inherit;color:inherit}button,select{cursor:pointer}button{border:1px solid #ccc9bd;background:#fffdf7;border-radius:9px;padding:8px 15px}button:hover{filter:brightness(.95)}button:focus-visible,input:focus-visible,textarea:focus-visible,select:focus-visible{outline:3px solid #179e85}header{border-bottom:1px solid #d9d6cb;background:#fffdf8}header>div,main{max-width:1190px;margin:auto;padding:0 5%}header>div{height:76px;display:flex;align-items:center;gap:14px}.brand{font-size:34px;font-weight:900;letter-spacing:-2px}.logo{background:#b4edcf;border:2px solid;border-radius:11px;width:39px;height:39px;display:grid;place-items:center;font-size:29px;line-height:1}.date{margin-inline-start:auto;color:#595a50;font-size:14px}main{padding-bottom:60px}.hero{margin:29px 0 26px;position:relative;isolation:isolate;overflow:hidden;background:#c6eed9;border:1px solid #93bb9e;border-radius:20px;padding:34px 6%;min-height:228px;display:flex;align-items:center}.hero h1{font-size:clamp(36px,5vw,62px);line-height:1.25;letter-spacing:-2px;margin:0}.hero p{margin:6px 0 18px}.primary{background:#25271f;color:white;border-color:#25271f;font-weight:bold}.art{direction:ltr;position:absolute;z-index:-1;left:0;top:0;width:43%;height:100%;background-image:radial-gradient(#8fbea4 1px,transparent 1px);background-size:15px 15px;mask-image:linear-gradient(to right,black 87%,transparent)}.book{position:absolute;width:134px;height:164px;left:30%;top:32px;border:2.5px solid #34352b;border-radius:9px;background:#ffdc78;transform:rotate(-14deg);box-shadow:5px 5px #444638}.book:before{content:"";position:absolute;inset:0 0 0 16px;border-left:2px solid #34352b}.book:after{content:"";position:absolute;left:36px;top:33px;color:#33362c;font:76px/1 Georgia}.memo{position:absolute;width:82px;height:73px;left:15%;bottom:28px;transform:rotate(12deg);background:repeating-linear-gradient(#dac8ff 0 16px,#8b78a7 17px,#dac8ff 18px);border:2px solid #37332f;box-shadow:3px 3px #37332f}.spark{position:absolute;left:69%;top:15%;font-size:38px}.row{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}h2{font-size:23px;margin:12px 0}.shelves{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}.shelf{text-align:right;display:flex;align-items:center;gap:13px;padding:19px 16px;font-weight:bold;border:1px solid #bcbcaf}.shelf i{width:42px;height:42px;display:grid;place-items:center;background:#ffffff8f;border:1px solid #38372c;border-radius:10px;font: bold 23px Georgia}.shelf small{display:block;font-weight:400;color:#4c4c45}.shelf:nth-child(1){background:#f7e7a9}.shelf:nth-child(2){background:#dfd4f5}.shelf:nth-child(3){background:#cde4f2}.selected{outline:2px solid #46483d;outline-offset:2px}.section{margin-top:27px}.tools{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.search,input,textarea,select{border:1px solid #c9c8bb;border-radius:8px;background:white;padding:8px 12px}.notes{display:grid;grid-template-columns:repeat(auto-fill,minmax(235px,1fr));gap:12px;margin-top:14px}.note,.empty{background:#fffefa;border:1px solid #d4d1c4;border-radius:12px;padding:19px}.note{text-align:start;overflow-wrap:anywhere}.note strong{display:block;font-size:19px}.note p{white-space:pre-line;color:#595950;margin:8px 0}.note small,.muted{color:#626358;font-size:14px}.empty{grid-column:1/-1;border-style:dashed;text-align:center;padding:23px}.projects{display:flex;gap:9px;flex-wrap:wrap}.projects button{background:#efede4}.projects b{margin-inline-start:8px;color:#585950}dialog{border:1px solid #999988;border-radius:18px;width:min(520px,94vw);background:#fcfaf4;padding:22px}dialog::backdrop{background:#21272066}form{display:grid;gap:10px}label{display:grid;gap:3px}textarea{resize:vertical;min-height:125px}footer{margin-top:29px;border-top:1px solid #d4d1c4;padding-top:15px}.ghost{background:none;border:none;padding:5px}.danger{color:#a23131}.hide{display:none!important}@media(max-width:650px){.hero{padding:23px 5%;min-height:195px}.hero p{max-width:58%;font-size:14px}.art{width:35%}.book{width:77px;height:102px;left:20%;top:42px}.book:after{font-size:42px;left:23px;top:25px}.memo{width:43px;height:47px;bottom:32px}.spark{font-size:22px}.shelves{gap:7px}.shelf{display:block;padding:10px;font-size:14px}.shelf i{margin-bottom:8px}.date{font-size:12px}.search{max-width:100%}.tools{width:100%}.search{flex:1;min-width:120px}header>div{height:62px}}
</style><header><div><span class="logo" aria-hidden="true"></span><span class="brand">ورق</span><span> / مساحتي</span><span class="date" id="date"></span></div></header><main><section class="hero"><div><h1>دفتر أفكاري</h1><p>لليوميات، والأفكار العابرة، وتفاصيل المشاريع.</p><button class="primary" id="newNote">＋ ملاحظة جديدة</button></div><div class="art" aria-hidden="true"><i class="book"></i><i class="memo"></i><span class="spark"></span></div></section><h2>دفاتري</h2><div class="shelves" id="shelves"></div><section class="section"><div class="row"><h2>مشاريعي التقنية</h2><button id="newProject">＋ مشروع</button></div><div class="projects" id="projects"></div></section><section class="section"><div class="row"><h2 id="heading">كل الملاحظات</h2><div class="tools"><input class="search" id="search" type="search" aria-label="بحث" placeholder="بحث في ملاحظاتي…"><button id="all">عرض الكل</button></div></div><div class="notes" id="notes"></div></section><footer class="row"><span class="muted">تُحفظ الملاحظات في قاعدة ورق</span><div><button class="ghost" id="backup">تصدير نسخة</button><button class="ghost" id="restore">استيراد نسخة</button><input type="file" id="file" accept=".json" hidden></div></footer><div role="status" id="status"></div></main>
<dialog id="editor"><form id="noteForm"><div class="row"><h2 id="editorTitle"></h2><button type="button" class="ghost" aria-label="إغلاق" id="closeEditor">إغلاق</button></div><label>العنوان<input id="titleField" maxlength="180" required></label><label>الملاحظة<textarea id="bodyField" placeholder="اكتبي ما يدور في بالك…"></textarea></label><label>الدفتر<select id="category"></select></label><label id="projectLabel">المشروع<select id="projectField"></select></label><span class="muted" id="hint" aria-live="polite"></span><div class="row"><button class="primary">حفظ الملاحظة</button><button type="button" id="remove" class="danger">حذف</button></div></form></dialog>
<dialog id="projectDialog"><form id="projectForm"><h2>مشروع جديد</h2><label>اسم المشروع<input id="projectName" required maxlength="100"></label><div class="row"><button class="primary">إضافة المشروع</button><button type="button" id="cancelProject">إلغاء</button></div></form></dialog><script>
"use strict";
const $=id=>document.getElementById(id);
const cats=["يومياتي","أفكاري","ملاحظاتي التقنية"],icons=["ي","ف","ت"];
let state = { projects: [], notes: [] };
let filterCat = "", filterProject = "", editing = "", previousDate, manual = false, busy = false;

async function requestState(data) {
    if (busy) return null;
    busy = true;
    const status = $("status");
    status.textContent = data ? "جاري حفظ التغييرات…" : "جاري تحميل الملاحظات…";
    try {
        const options = data ? {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify(data)
        } : {};
        const response = await fetch("/api/notes", { ...options, cache: "no-store" });
        const result = await response.json();
        if (!response.ok) throw Error(result.error || "تعذر إكمال العملية.");
        state = result;
        render();
        status.textContent = "";
        return result;
    } catch (error) {
        status.textContent = "تعذر إكمال العملية.";
        alert(error.message || "تحققي من الاتصال وأعيدي المحاولة.");
        return null;
    } finally {
        busy = false;
    }
}
function el(tag,txt,cls){const e=document.createElement(tag);e.textContent=txt;if(cls)e.className=cls;return e}
const fmt=n=>new Intl.NumberFormat("ar-SA").format(n);
function norm(s){return s.toLowerCase().replace(/[َ-ْ]/g,"").replace(/[أإآ]/g,"ا").replace(/ة/g,"ه")}
function render(){
 $("shelves").replaceChildren(...cats.map((cat,i)=>{const b=el("button","","shelf"+(filterCat===cat?" selected":""));const label=el("span",cat);label.append(el("small",fmt(state.notes.filter(n=>n.cat===cat).length)+" ملاحظات"));b.append(el("i",icons[i]),label);b.onclick=()=>{filterCat=filterCat===cat?"":cat;filterProject="";render()};return b}));
 $("projects").replaceChildren(...state.projects.map(p=>{const b=el("button",p,filterProject===p?"selected":"");b.append(el("b",fmt(state.notes.filter(n=>n.project===p).length)));b.onclick=()=>{filterProject=filterProject===p?"":p;filterCat="";render()};return b}));
 $("heading").textContent=filterProject||filterCat||"كل الملاحظات";
 const q=norm($("search").value.trim());
 const list=state.notes.filter(n=>(!filterCat||n.cat===filterCat)&&(!filterProject||n.project===filterProject)&&norm([n.title,n.body,n.cat,n.project].join(" ")).includes(q)).sort((a,b)=>Date.parse(b.date)-Date.parse(a.date));
 $("notes").replaceChildren(...list.map(n=>{const b=el("button","","note");b.append(el("small",n.project||n.cat),el("strong",n.title),el("p",n.body.slice(0,145)),el("small",new Date(n.date).toLocaleDateString("ar-SA")));b.onclick=()=>openEditor(n);return b}));
 if(!list.length){const e=el("div","","empty");e.append(el("strong",q?"لا توجد ملاحظات مطابقة":"صفحة جديدة تنتظر أفكارك"),el("div",q?"جرّبي البحث بكلمة أخرى.":"أضيفي أول ملاحظة في هذه المساحة.","muted"));if(!q){const b=el("button","＋ كتابة ملاحظة","ghost");b.onclick=()=>openEditor();e.append(b)}$("notes").append(e)}
}
function syncProject(){const on=$("category").value===cats[2];$("projectLabel").hidden=!on;$("projectLabel").classList.toggle("hide",!on);if(!on)$("projectField").value=""}
function openEditor(n){editing=n?.id||"";previousDate=n?.date;manual=!!(n||filterCat||filterProject);$("editorTitle").textContent=n?"تحرير الملاحظة":"ملاحظة جديدة";$("titleField").value=n?.title||"";$("bodyField").value=n?.body||"";$("category").replaceChildren(...cats.map(c=>new Option(c,c)));$("category").value=n?.cat||filterCat||(filterProject?cats[2]:cats[0]);$("projectField").replaceChildren(new Option("دون مشروع",""),...state.projects.map(p=>new Option(p,p)));$("projectField").value=n?.project||filterProject;$("hint").textContent="";$("remove").hidden=!editing;syncProject();$("editor").showModal()}
function suggest(){if(manual)return;const t=norm($("titleField").value+" "+$("bodyField").value);const p=state.projects.find(p=>t.includes(norm(p)));let cat=p||/برمج|تقني|كود|قاعده بيانات|api\b|github|مشروع|واجهه/.test(t)?cats[2]:/فكره|افكار|مقترح|ماذا لو/.test(t)?cats[1]:cats[0];$("category").value=cat;syncProject();$("projectField").value=p||"";$("hint").textContent="الدفتر المقترح من كلمات الملاحظة — "+cat+(p?" · "+p:"")}
$("titleField").oninput=$("bodyField").oninput=suggest;$("category").onchange=()=>{manual=true;$("hint").textContent="";syncProject()};$("projectField").onchange=()=>{manual=true;$("hint").textContent=""};
$("newNote").onclick=()=>openEditor();$("closeEditor").onclick=()=>$("editor").close();$("newProject").onclick=()=>{$("projectName").value="";$("projectDialog").showModal()};$("cancelProject").onclick=()=>$("projectDialog").close();
$("projectForm").onsubmit = async event => {
    event.preventDefault();
    const name = $("projectName").value.trim();
    if (!name || !await requestState({ action: "project", name })) return;
    $("projectDialog").close();
    filterProject = name;
    filterCat = "";
    render();
};
$("noteForm").onsubmit = async event => {
    event.preventDefault();
    const title = $("titleField").value.trim();
    if (!title) { $("titleField").focus(); return; }
    const note = {
        id: editing || crypto.randomUUID(),
        title,
        body: $("bodyField").value,
        cat: $("category").value,
        project: $("projectField").value,
        date: new Date().toISOString()
    };
    if (!await requestState({ action: "save", note, previousDate })) return;
    $("editor").close();
    $("status").textContent = "حُفظت الملاحظة.";
};
$("remove").onclick = async () => {
    if (busy || !confirm("حذف هذه الملاحظة؟")) return;
    if (await requestState({ action: "delete", id: editing, previousDate })) $("editor").close();
};
$("all").onclick=()=>{filterCat=filterProject=$("search").value="";render()};$("search").oninput=render;
$("backup").onclick=()=>{const url=URL.createObjectURL(new Blob([JSON.stringify(state,null,2)],{type:"application/json"}));const a=el("a","");a.href=url;a.download="waraq-notes.json";a.click();setTimeout(()=>URL.revokeObjectURL(url),1000)};
$("restore").onclick = () => $("file").click();
$("file").onchange = async event => {
    const file = event.target.files[0];
    if (!file) return;
    try {
        const backup = JSON.parse(await file.text());
        const result = await requestState({ action: "import", backup });
        if (!result) return;
        $("status").textContent = result.conflicts
            ? "اكتمل الاستيراد. راجعي " + result.conflicts + " ملاحظات تحمل معرّفات محفوظة بمحتوى مختلف."
            : "اكتمل الاستيراد وتطابقت الملاحظات مع النسخة.";
    } catch {
        alert("تعذرت قراءة الملف. اختاري نسخة JSON صادرة من ورق.");
    } finally {
        event.target.value = "";
    }
};
$("date").textContent=new Intl.DateTimeFormat("ar-SA-u-ca-gregory",{weekday:"long",day:"numeric",month:"long"}).format(new Date());render();requestState();

</script></html>
